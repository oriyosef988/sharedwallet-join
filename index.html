<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>SharedWallet</title>
</head>

<body>
  <h2>הצטרפות ל-SharedWallet</h2>

  <p>
    לחץ על הכפתור כדי לפתוח את האפליקציה ולהצטרף לארנק.
  </p>

  <button id="openApp">
    פתח את SharedWallet
  </button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    const deepLink = code
      ? 'sharedwallet://join?code=' + encodeURIComponent(code)
      : 'sharedwallet://';

    document
      .getElementById('openApp')
      .addEventListener('click', () => {
        window.location.href = deepLink;
      });
  </script>
</body>
</html>
