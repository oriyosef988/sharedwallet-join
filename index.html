<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>הצטרפות ל-SharedWallet</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 10% 20%,
          #dceeff 0,
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 80%,
          #d8eaff 0,
          transparent 35%
        ),
        #f7fbff;

      color: #14213d;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 28px 18px;
    }

    .page {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* App branding */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      margin-bottom: 28px;
    }

    .wallet-icon {
      width: 54px;
      height: 54px;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #1577f2,
          #0754c7
        );

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 8px 22px rgba(21, 119, 242, 0.25);

      font-size: 29px;
    }

    .brand-name {
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -1px;
      direction: ltr;
    }

    .brand-name span {
      color: #1478f2;
    }

    /* Main card */
    .card {
      background: rgba(255, 255, 255, 0.96);

      border-radius: 26px;

      padding: 36px 24px 28px;

      box-shadow:
        0 18px 55px rgba(28, 78, 130, 0.13);

      border: 1px solid rgba(215, 230, 247, 0.8);
    }

    .people-icon {
      width: 78px;
      height: 78px;

      margin: 0 auto 22px;

      border-radius: 50%;

      background: #edf6ff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;

      border: 1px solid #d8eaff;
    }

    h1 {
      margin: 0 0 15px;

      font-size: 28px;
      line-height: 1.25;

      color: #102448;
    }

    .description {
      margin: 0 auto;

      max-width: 370px;

      font-size: 17px;
      line-height: 1.7;

      color: #68758a;
    }

    .description strong {
      color: #1478f2;
      font-weight: 700;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 25px 0;
    }

    .divider-line {
      height: 1px;
      flex: 1;
      background: #e2eaf3;
    }

    .divider-icon {
      width: 36px;
      height: 36px;

      border-radius: 50%;

      background: #edf6ff;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #1478f2;

      font-size: 18px;
    }

    /* Main button */
    #openApp {
      width: 100%;

      border: none;
      border-radius: 16px;

      padding: 17px 20px;

      background:
        linear-gradient(
          135deg,
          #1b86ff,
          #0865e8
        );

      color: white;

      font-size: 18px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 10px 24px rgba(17, 112, 238, 0.27);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    #openApp:active {
      transform: scale(0.98);

      box-shadow:
        0 5px 15px rgba(17, 112, 238, 0.22);
    }

    .secure {
      margin-top: 18px;

      font-size: 13px;

      color: #7d8999;
    }

    /* Help box */
    .help {
      margin-top: 25px;

      padding: 18px;

      border-radius: 16px;

      background: #f7fbff;

      border: 1px solid #dceafb;

      color: #637086;

      font-size: 14px;
      line-height: 1.6;
    }

    .help strong {
      display: block;

      margin-bottom: 5px;

      color: #233754;

      font-size: 15px;
    }

    .invite-code {
      display: none;

      margin-top: 16px;

      font-size: 13px;

      color: #8793a3;
    }

    .invite-code span {
      direction: ltr;
      display: inline-block;
      font-weight: 700;
    }

    footer {
      margin-top: 26px;

      color: #8390a2;

      font-size: 13px;

      direction: ltr;
    }

    @media (max-width: 400px) {
      .card {
        padding: 30px 19px 24px;
      }

      h1 {
        font-size: 25px;
      }

      .description {
        font-size: 16px;
      }

      .brand-name {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">
      <div class="wallet-icon">👥</div>

      <div class="brand-name">
        Shared<span>Wallet</span>
      </div>
    </div>


    <section class="card">

      <div class="people-icon">
        👥
      </div>

      <h1>
        הצטרפות לארנק משותף
      </h1>

      <p class="description">
        הוזמנת להצטרף לארנק משותף ב־
        <strong>SharedWallet</strong>.
        <br />
        פתח את האפליקציה כדי להמשיך.
      </p>


      <div class="divider">
        <div class="divider-line"></div>

        <div class="divider-icon">
          🔗
        </div>

        <div class="divider-line"></div>
      </div>


      <button id="openApp">
        פתח את SharedWallet
      </button>


      <div class="secure">
        🔒 פתיחה מאובטחת באפליקציית SharedWallet
      </div>


      <div class="help">
        <strong>
          האפליקציה לא נפתחה?
        </strong>

        לחץ על הכפתור למעלה וודא ש־SharedWallet
        מותקנת במכשיר שלך.
      </div>


      <div
        id="inviteCode"
        class="invite-code"
      >
        קוד הזמנה:
        <span id="codeText"></span>
      </div>

    </section>


    <footer>
      SharedWallet
    </footer>

  </main>


  <script>
    const params =
      new URLSearchParams(window.location.search);

    const code = params.get('code');


    const deepLink = code
      ? 'sharedwallet://join?code=' +
        encodeURIComponent(code)
      : 'sharedwallet://';


    const openApp = () => {
      window.location.href = deepLink;
    };


    document
      .getElementById('openApp')
      .addEventListener('click', openApp);


    if (code) {
      document
        .getElementById('codeText')
        .textContent = code.toUpperCase();

      document
        .getElementById('inviteCode')
        .style.display = 'block';
    }


    /*
      ניסיון אוטומטי לפתוח את האפליקציה.

      אם הדפדפן חוסם את זה,
      האתר נשאר פתוח והמשתמש יכול
      ללחוץ על הכפתור.
    */
    setTimeout(() => {
      openApp();
    }, 700);
  </script>

</body>
</html>
